name: CI

# Что и когда запускается:
#   push          — любой пуш в любую ветку: 27 тестов + сверка копий;
#   pull_request  — то же для PR;
#   вручную       — кнопка «Run workflow» (workflow_dispatch).
#
# Задача vps-drift (сверка с кодом на сервере) выключена по умолчанию:
# ей нужны секреты VPS_HOST / VPS_SSH_KEY. Включается переменной
# репозитория ENABLE_VPS_DRIFT=true (Settings → Variables).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Тесты печатают кириллицу; на бегуне локаль C, но пусть будет явно.
  PYTHONIOENCODING: utf-8

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Тесты · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.10 — нижняя граница (Ubuntu 22.04 без PPA), 3.12 — как на VPS,
        # 3.14 — как на рабочей машине.
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # Сторонних зависимостей у тестов нет (только stdlib: paramiko нужен
      # лишь deploy/), поэтому pip install не требуется.

      # Страховка от «тихого» сокращения набора: если тестовый файл потеряли
      # или забыли закоммитить, прогон станет короче и это заметят сразу.
      # Ожидаемое число можно поднять переменной репозитория EXPECTED_TESTS.
      - name: Проверить, что набор тестов не потерялся
        run: |
          set -euo pipefail
          expected="${{ vars.EXPECTED_TESTS }}"
          [ -n "$expected" ] || expected=28
          actual=$(python -c 'import sys; sys.path.insert(0, "."); import run_tests; print(len(run_tests.discover()))')
          echo "тестовых файлов: $actual (ожидается $expected)"
          if [ "$actual" -ne "$expected" ]; then
            echo "::error::ожидалось $expected тестовых файлов, найдено $actual"
            exit 1
          fi

      - name: Прогон всех тестов
        run: |
          set -o pipefail
          python run_tests.py | tee tests.log

      - name: Сводка в интерфейс
        if: always()
        run: |
          {
            echo "### Тесты · Python ${{ matrix.python }}"
            echo '```'
            tail -n 8 tests.log 2>/dev/null || echo 'прогон не состоялся'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  copies:
    name: Сверка копий и чистота репозитория
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: work

      # Сверка через штатный compare_copies.py: рабочая копия против
      # git archive HEAD. Ловит то, чего не видно глазами — CRLF-дрейф и
      # расхождение байтов (compare_copies сравнивает sha1).
      - name: Коммит воспроизводится байт в байт
        run: |
          set -euo pipefail
          mkdir -p fresh
          git -C work archive HEAD | tar -x -C fresh
          python work/compare_copies.py work fresh

      # Секреты не отслеживаются + в дереве нет файлов, которых нет в коммите.
      - name: Секреты и полнота дерева
        run: bash work/ci/check_repo.sh

  vps-drift:
    name: Дрейф кода на VPS
    # Включается переменной репозитория ENABLE_VPS_DRIFT=true и секретами
    # VPS_HOST / VPS_SSH_KEY. Пока выключено — задача пропускается.
    # Ключ VPS_SSH_KEY должен быть в authorized_keys пользователя admin
    # на сервере (root-логин отключён, работает только admin).
    if: vars.ENABLE_VPS_DRIFT == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: work

      - name: Подготовить SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Сравнить репозиторий с кодом на VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p fresh vps
          git -C work archive HEAD | tar -x -C fresh
          # admin, не root: root-логин на VPS отключён (sshd-hardening.conf)
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
              admin@"$VPS_HOST" \
              'tar -czf - -C "$HOME/bybit-funding" \
                 --exclude=.git --exclude=__pycache__ --exclude=_bak .' > vps.tar.gz
          tar -xzf vps.tar.gz -C vps
          python work/compare_copies.py fresh vps
