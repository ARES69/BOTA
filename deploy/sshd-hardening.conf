# Политика SSH для сервера с ботом. Ставится как
#     /etc/ssh/sshd_config.d/00-hardening.conf
#
# Имя начинается с 00 намеренно. sshd берёт ПЕРВОЕ встреченное значение
# параметра, а /etc/ssh/sshd_config подключает drop-in'ы через
# `Include /etc/ssh/sshd_config.d/*.conf` самой первой строкой. Поэтому
# файл, прочитанный первым, и задаёт политику: 50-cloud-init.conf
# (PasswordAuthentication yes) и 60-cloudimg-settings.conf заведомо
# проигрывают. Файл 99-*.conf, наоборот, не смог бы переопределить 00-*.

# 1. Root по SSH не входит вообще. Управление — только через admin + sudo.
PermitRootLogin no

# 2. Кто может входить. Список без адресов: IP у домашней сети меняется,
#    а жёсткий allowlist по адресу запирает доступ при смене провайдера.
#    Брутфорс ограничивает fail2ban (jail.local), а не список адресов.
#    Нужен ещё пользователь — добавьте его сюда, иначе вход будет закрыт.
AllowUsers admin

# 3. Меньше попыток и меньше времени на «повисшее» соединение.
MaxAuthTries 4
LoginGraceTime 30

# 4. Пароли и интерактивная аутентификация выключены (ключи).
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
