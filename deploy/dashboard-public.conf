# Drop-in для ДОБРОВОЛЬНОГО открытия панели наружу.
#
# Ставится только по явному запросу:
#     DASHBOARD_PUBLIC=1 DASHBOARD_PASSWORD='...' bash deploy/deploy_vps.sh
#
# Без этого drop-in панель слушает 127.0.0.1:8050 и доступна только через
# SSH-туннель — так безопаснее, и именно так настроен рабочий сервер.
# Публичный bind открывает всему интернету позицию, PnL и кнопки
# управления, поэтому требует DASHBOARD_PASSWORD в .env: без пароля
# панель не стартует (fail closed).
[Service]
ExecStart=
ExecStart=/usr/bin/python3 /home/admin/bybit-funding/dashboard.py --serve 8050 --host 0.0.0.0 --refresh 30
